[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Built-in installers discard included runtime files; publish the bundled installers below instead.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
github-build-setup = "../build-setup.yml"
include = ["runtime/"]

# Where to host releases
hosting = "github"
# Upload all assets to the prepared draft before publishing an immutable release.
create-release = false
# Normalize checksum artifacts in the publish job before uploading the draft.
github-release = "announce"
publish-jobs = ["./dispatch-crates-io-publish"]
github-custom-job-permissions = { "dispatch-crates-io-publish" = { actions = "write" } }
# Whether to install an updater program
install-updater = false
[[dist.extra-artifacts]]
artifacts = ["target/gitscry-installers/gitscry-installer.sh", "target/gitscry-installers/gitscry-installer.ps1"]
build = ["sh", "scripts/build-installers.sh"]
