name: Dispatch crates.io publish

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  normalize-checksums:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - artifacts-build-local-aarch64-apple-darwin
          - artifacts-build-local-x86_64-unknown-linux-gnu
          - artifacts-build-local-x86_64-pc-windows-msvc
          - artifacts-build-global
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
      - name: Remove blank checksum lines
        run: |
          find artifacts -type f \( -name '*.sha256' -o -name 'sha256.sum' \) \
            -exec sed -i '/^$/d' {} +
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          overwrite: true

  dispatch:
    needs: normalize-checksums
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main --field tag="$RELEASE_TAG"
