name: Publish crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

jobs:
  publish:
    # v0.1.0 is bootstrapped manually; later releases use trusted publishing.
    if: (github.event_name == 'release' && github.event.release.tag_name != 'v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.tag != 'v0.1.0')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish gitscry
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
