name: Manual encoder distribution gate

# Deliberately no push or pull_request trigger. Source builds are expensive.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: encoder-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  musl:
    name: Static CPU ONNX Runtime on Linux musl
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore exact native archive recipe
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: tools/encoder-gate/.native/ort-packed
          key: encoder-musl-alpine3.22-rust1.89-${{ hashFiles('tools/encoder-gate/linux-musl.sh', 'tools/encoder-gate/pack-runtime.py') }}
      - name: Build unmodified upstream and execute pinned graph
        shell: bash
        run: |
          set -o pipefail
          # Linux is exercised only on GitHub's runner, never simulated locally.
          docker run --rm \
            -v "$PWD:/work" -w /work \
            rust:1.89.0-alpine3.22 \
            sh tools/encoder-gate/linux-musl.sh 2>&1 | tee encoder-gate-musl.log
      - name: Cache completed native archive even if the Rust probe fails
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && hashFiles('tools/encoder-gate/.native/ort-packed/libonnxruntime.a') != ''
        uses: actions/cache/save@v5
        with:
          path: tools/encoder-gate/.native/ort-packed
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Preserve evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoder-gate-musl-${{ github.run_id }}
          retention-days: 14
          path: |
            encoder-gate-musl.log
            tools/encoder-gate/.native/elf-*.txt
            tools/encoder-gate/.native/ort-packed/archive-inputs.txt
            tools/encoder-gate/.native/ort/Release/CMakeCache.txt
            tools/encoder-gate/.native/ort/Release/CMakeFiles/CMakeConfigureLog.yaml
