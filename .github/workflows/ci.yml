name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features --jobs 1 -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features --jobs 1

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Run tests on the declared MSRV
        run: cargo test --locked --all-targets --all-features --jobs 1

  release-targets:
    name: Test ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - name: Windows x86-64 MSVC
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Run target tests
        run: cargo test --locked --all-targets --all-features --target ${{ matrix.target }} --jobs 1
