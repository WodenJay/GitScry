[package]
name = "gitscry-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
flate2 = "1"
gitscry = { path = ".." }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
