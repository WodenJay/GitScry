# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header_marker = "<!-- git-cliff: end of header -->"

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""

trim = true
render_always = true

postprocessors = []

[git]

# Parse Conventional Commits such as:
# feat(update): add self-update command
# fix(cache): ...
conventional_commits = true

# Keep unconventional commits available so merge commits can be
# explicitly filtered without producing parse-error warnings.
filter_unconventional = false

require_conventional = false
split_commits = false

commit_preprocessors = []

# A breaking change should still appear even if its type would
# otherwise be skipped.
protect_breaking_commits = true

commit_parsers = [
    # User-facing changes
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
    { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
    { message = "^revert", group = "<!-- 5 -->◀️ Revert" },

    # Internal/noisy changes that should not appear in CHANGELOG
    { message = "^test", skip = true },
    { message = "^style", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },

    # Git merge commits
    { message = "^Merge ", skip = true },

    # Ignore any other unconventional/unclassified commit
    { message = ".*", skip = true },
]

# Every commit is handled by one of the parsers above.
filter_commits = false
fail_on_unmatched_commit = false

link_parsers = []

use_branch_tags = false
topo_order = false
topo_order_commits = true

# Preserve commit order within each section.
sort_commits = "oldest"

recurse_submodules = false