[package]
name = "gitscry"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "GitScry uncovers the implementation examples, failed approaches, code relationships, and regression context hidden inside."
repository = "https://github.com/WodenJay/GitScry"
readme = "README.md"
homepage = "https://github.com/WodenJay/GitScry"

[dependencies]
clap = { version = "4", features = ["derive"] }
lz4_flex = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
