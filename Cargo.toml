[package]
name = "gitscry"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "GitScry uncovers the implementation examples, failed approaches, code relationships, and regression context hidden inside."
repository = "https://github.com/WodenJay/GitScry"
readme = "README.md"
homepage = "https://github.com/WodenJay/GitScry"

[dependencies]
clap = { version = "4", features = ["derive"] }
lz4_flex = "0.14"
lzma-rs = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
