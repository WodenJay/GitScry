[package]
name = "gitscry"
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "GitScry uncovers the implementation examples, failed approaches, code relationships, and regression context hidden inside."
repository = "https://github.com/WodenJay/GitScry"
readme = "README.md"
exclude = [
    "docs/assets/gitscry_60s_*.mp4",
    "docs/assets/*.gif",
    "docs/assets/thumbnail_*.png",
    "docs/assets/trace-fix_example.png",
    "xtask/**",
]
homepage = "https://github.com/WodenJay/GitScry"

[dependencies]
clap = { version = "4", features = ["derive"] }
lz4_flex = "0.14"
lzma-rs = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = "3"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "=0.22.1", default-features = false, features = ["fancy-regex"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
